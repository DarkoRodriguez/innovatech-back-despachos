version: '3.8'

services:
  backend-despachos:
    container_name: api_despachos
    image: ${AWS_REGISTRY}/innovatech-back-despachos:latest
    ports:
      - "8081:8081"
    environment:
      - DB_ENDPOINT=${DB_ENDPOINT}
      - DB_PORT=3306
      - DB_NAME=db_innovatech
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - backend_despachos_logs:/app/logs
    restart: unless-stopped
    networks:
      - innovatech-private-net

volumes:
  backend_despachos_logs:
    name: innovatech_despachos_logs

networks:
  innovatech-private-net:
    driver: bridge
